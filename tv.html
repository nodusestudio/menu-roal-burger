<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROAL BURGER · Pantalla del local</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="isotipo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Pantalla de TV del local. Se dibuja en un lienzo fijo de 1920×1080 que tv.js escala a cualquier TV.
           Marca: naranja #fb4b08, marrón #5e3d2c, crema #f9f3e9, negro. Sin cursor ni botones. */
        :root {
            --naranja: #fb4b08;
            --marron: #5e3d2c;
            --crema: #f9f3e9;
            --rotacion: 8s;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; user-select: none; -webkit-user-select: none; }
        body { font-family: 'Montserrat', Arial, sans-serif; }

        #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--crema); overflow: hidden; }

        /* ── Mitad izquierda: foto de esquina a esquina, con zoom lento ── */
        .foto-wrap { position: absolute; left: 0; top: 0; width: 960px; height: 960px; background: #000; overflow: hidden; }
        .foto { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease; overflow: hidden; }
        .foto.on { opacity: 1; }
        .foto img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1); transform-origin: 50% 50%; }
        .foto.zoom img { animation: zoom 9s ease-out forwards; }
        @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.14); } }

        /* ── Mitad derecha ── */
        .info { position: absolute; left: 960px; top: 0; width: 960px; height: 960px; background: var(--crema); overflow: hidden; }
        .linea { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--naranja); z-index: 3; }
        .marca-agua { position: absolute; right: -40px; bottom: -150px; font-family: 'Anton', Impact, sans-serif; font-size: 620px; line-height: 1; color: rgba(94, 61, 44, 0.07); letter-spacing: 6px; z-index: 0; pointer-events: none; }
        .panel { position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 70px 70px 70px 100px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 34px; z-index: 2; transition: opacity .28s ease; }
        .panel.saliendo { opacity: 0; }

        .etq { display: inline-block; background: var(--naranja); color: #fff; font-weight: 800; font-size: 32px; letter-spacing: 3px; text-transform: uppercase; padding: 14px 32px; border-radius: 999px; box-shadow: 0 8px 22px rgba(251, 75, 8, .28); animation: etqIn .7s cubic-bezier(.2, .9, .25, 1) both; }
        @keyframes etqIn { from { opacity: 0; transform: translateX(-120px); } to { opacity: 1; transform: translateX(0); } }

        .nombre { font-family: 'Anton', Impact, sans-serif; font-weight: 400; color: var(--marron); text-transform: uppercase; line-height: 1.02; letter-spacing: 1px; }
        .nombre .w { display: inline-block; animation: palIn .65s cubic-bezier(.2, .9, .25, 1) both; animation-delay: calc(.25s + var(--i) * .13s); }
        @keyframes palIn { from { opacity: 0; transform: translateY(46px); } to { opacity: 1; transform: translateY(0); } }

        .ings { list-style: none; display: flex; flex-wrap: wrap; gap: 12px 12px; max-width: 800px; }
        .ings li { font-weight: 700; font-size: 26px; color: var(--marron); background: rgba(94, 61, 44, .08); border: 2px solid rgba(94, 61, 44, .28); border-radius: 999px; padding: 8px 22px; animation: ingIn .5s cubic-bezier(.2, .9, .25, 1) both; animation-delay: var(--d); }
        @keyframes ingIn { from { opacity: 0; transform: translateY(22px) scale(.85); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .precio { font-family: 'Anton', Impact, sans-serif; font-size: 190px; line-height: 1; color: var(--naranja); letter-spacing: 2px; transform-origin: left center;
            animation: precioIn .95s cubic-bezier(.2, .9, .25, 1) var(--d) both, latido 2.6s ease-in-out calc(var(--d) + 1.2s) infinite; }
        .precio small { font-size: .55em; vertical-align: .38em; margin-right: 6px; }
        .precio.dos { font-size: 230px; }
        @keyframes precioIn { 0% { opacity: 0; transform: scale(.2); } 55% { opacity: 1; transform: scale(1.2); } 75% { transform: scale(.93); } 90% { transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }

        /* ── Barra de progreso hacia el siguiente producto ── */
        /* Oculta por pedido del dueño (2026-11-03); el JS de tv.js sigue animándola sin efecto visible. */
        #barra { display: none; position: absolute; left: 0; right: 0; top: 952px; height: 8px; background: rgba(0, 0, 0, .22); z-index: 5; }
        body.en-pausa #barra { opacity: 0; }
        #barra i { display: block; height: 100%; width: 0; background: var(--naranja); }
        @keyframes prog { from { width: 0; } to { width: 100%; } }

        /* ── Franja inferior naranja ── */
        footer { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: var(--naranja); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; z-index: 6; }
        .f-marca { font-family: 'Anton', Impact, sans-serif; font-size: 60px; letter-spacing: 3px; text-transform: uppercase; }
        .f-web { font-weight: 700; font-size: 38px; letter-spacing: .5px; }
        .f-web b { font-weight: 800; }
        .f-qr { display: flex; align-items: center; gap: 22px; }
        .f-qr span { font-weight: 800; font-size: 34px; text-transform: uppercase; letter-spacing: 1px; }
        .qr { width: 104px; height: 104px; background: #fff; border-radius: 10px; padding: 4px; }
        .qr svg { width: 100%; height: 100%; display: block; }

        /* ── Pantalla completa: el botón y la ayuda solo aparecen al mover el mouse / tocar y se ocultan solos ── */
        body.activo, body.activo * { cursor: default; }
        #btnFs { position: fixed; top: 18px; right: 18px; width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .75); background: rgba(0, 0, 0, .6); color: #fff; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 50; padding: 0; }
        body.activo #btnFs { opacity: 1; pointer-events: auto; cursor: pointer; }
        #btnFs svg { width: 30px; height: 30px; }
        #btnFs .ico-salir { display: none; }
        body.es-fs #btnFs .ico-entrar { display: none; }
        body.es-fs #btnFs .ico-salir { display: block; }
        #hint { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); background: rgba(0, 0, 0, .78); color: #fff; font-weight: 700; font-size: 20px; padding: 14px 26px; border-radius: 999px; z-index: 50; display: none; max-width: 86vw; text-align: center; }
        body.con-ayuda #hint { display: block; }

        /* ── Cobro con QR: lo abre el POS (configuracion/tv_cobro). Reemplaza el texto de la mitad derecha; la foto sigue rotando ── */
        .info.con-cobro .panel, .info.con-cobro .marca-agua { display: none; }
        .cobro { position: absolute; left: 12px; top: 0; right: 0; bottom: 0; display: none; flex-direction: column; align-items: center; padding: 30px 40px 26px 52px; z-index: 4; }
        .info.con-cobro .cobro { display: flex; }
        .c-etq { background: var(--naranja); color: #fff; font-weight: 800; font-size: 30px; letter-spacing: 3px; text-transform: uppercase; padding: 8px 26px; border-radius: 10px; margin-bottom: 16px; animation: cIn .6s cubic-bezier(.2, .9, .25, 1) both; }
        .c-qr { position: relative; width: 500px; height: 500px; background: #fff; border-radius: 26px; padding: 20px; border: 6px solid var(--naranja); box-shadow: 0 14px 40px rgba(94, 61, 44, .28); animation: cIn .7s cubic-bezier(.2, .9, .25, 1) .1s both; }
        .c-qr svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
        .c-qr::after { content: ''; position: absolute; inset: -6px; border-radius: 26px; border: 6px solid var(--naranja); opacity: 0; animation: cPulso 2.4s ease-out infinite; pointer-events: none; }
        .c-total { font-family: 'Anton', Impact, sans-serif; font-size: 122px; line-height: 1.05; color: var(--naranja); margin-top: 14px; letter-spacing: 2px; animation: cIn .7s cubic-bezier(.2, .9, .25, 1) .2s both, latido 2.6s ease-in-out 1.2s infinite; }
        .c-parcial { font-weight: 800; font-size: 26px; color: var(--naranja); background: rgba(251, 75, 8, .12); border-radius: 999px; padding: 5px 22px; margin-top: 2px; }
        .c-parcial[hidden] { display: none; }
        .c-ayuda { font-weight: 700; font-size: 29px; color: var(--marron); text-align: center; margin-top: 2px; }
        .c-fodi { display: flex; align-items: center; gap: 22px; margin-top: auto; padding-top: 12px; width: 100%; justify-content: center; }
        .c-msg { font-weight: 800; font-size: 30px; color: var(--marron); max-width: 640px; line-height: 1.15; }
        .c-msg .pts i { display: inline-block; font-style: normal; animation: cPunto 1.2s infinite; }
        .c-msg .pts i:nth-child(2) { animation-delay: .2s; }
        .c-msg .pts i:nth-child(3) { animation-delay: .4s; }
        @keyframes cIn { from { opacity: 0; transform: translateY(40px) scale(.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes cPulso { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.09); } }
        @keyframes cPunto { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

        /* FODI, la mascota: MISMOS colores y formas que en el panel (mini pantalla con ojos y boca). Lo dibuja tv.js. */
        .fodi { flex: none; width: 150px; height: 150px; border-radius: 30%; }
        .fodi-svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 3px 10px rgba(197, 139, 255, .35)); }
        .f-screen { fill: #14101f; stroke: rgba(255, 179, 92, .6); stroke-width: 1.8; }
        .f-gloss { fill: rgba(255, 255, 255, .08); }
        .f-eye { fill: #ffd9a0; }
        .f-arc { fill: none; stroke: #ffd9a0; stroke-width: 3.6; stroke-linecap: round; opacity: 0; }
        .f-mouth { fill: #ff8a5c; stroke: #ffd9a0; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
        .f-blush { fill: #ff7a8a; opacity: 0; }
        .f-zzz, .f-stars, .f-bulb, .f-qm, .f-hearts { opacity: 0; }
        .f-hearts path { fill: #ff6b9d; }
        .f-zzz text, .f-qm { fill: #c58bff; font-weight: 700; font-family: system-ui, sans-serif; }
        .f-stars path { fill: #ffe27a; }
        .f-bulb circle { fill: #ffe27a; } .f-bulb rect { fill: #c9a24a; }
        .f-stars { animation: fodiTwinkle .9s ease-in-out infinite alternate; }
        @keyframes fodiTwinkle { from { transform: scale(.9); } to { transform: scale(1.08); } }

        /* Pago confirmado: se esconde el QR y aparece el agradecimiento */
        .c-gracias { display: none; flex-direction: column; align-items: center; text-align: center; margin-top: 6px; }
        .cobro.pagado .c-etq, .cobro.pagado .c-qr, .cobro.pagado .c-total, .cobro.pagado .c-ayuda, .cobro.pagado .c-parcial { display: none; }
        .cobro.pagado .c-gracias { display: flex; }
        .g-check { width: 200px; height: 200px; }
        .g-check circle { fill: none; stroke: #2e9d5b; stroke-width: 8; stroke-dasharray: 300; stroke-dashoffset: 300; animation: gTrazo .7s ease-out .1s forwards; }
        .g-check path { fill: none; stroke: #2e9d5b; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 80; stroke-dashoffset: 80; animation: gTrazo .45s ease-out .7s forwards; }
        .g-nombre { font-family: 'Anton', Impact, sans-serif; font-size: 82px; line-height: 1.05; color: var(--marron); text-transform: uppercase; margin-top: 8px; max-width: 840px; animation: cIn .7s cubic-bezier(.2, .9, .25, 1) .3s both; }
        .g-detalle { font-weight: 800; font-size: 38px; color: var(--marron); margin-top: 14px; animation: cIn .7s cubic-bezier(.2, .9, .25, 1) .5s both; }
        .g-adios { font-family: 'Anton', Impact, sans-serif; font-size: 64px; color: var(--naranja); margin-top: 12px; letter-spacing: 1px; animation: cIn .7s cubic-bezier(.2, .9, .25, 1) .7s both, latido 2s ease-in-out 1.4s infinite; }
        @keyframes gTrazo { to { stroke-dashoffset: 0; } }
        .c-confeti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .c-confeti i { position: absolute; top: -30px; width: 12px; height: 20px; border-radius: 3px; opacity: 0; animation: cConfeti 3s ease-in forwards; }
        @keyframes cConfeti { 0% { opacity: 1; transform: translateY(0) rotate(0); } 100% { opacity: 1; transform: translateY(1050px) rotate(720deg); } }
    </style>
</head>

        <section class="foto-wrap">
            <div class="foto" id="fotoA"><img alt=""></div>

                </div>
                <div class="c-confeti" id="cConfeti" aria-hidden="true"></div>
            </div>

        </footer>
    </div>
    <button type="button" id="btnFs" aria-label="Pantalla completa" title="Pantalla completa (F)">
        <svg class="ico-entrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
