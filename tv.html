<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROAL BURGER · Pantalla del local</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="isotipo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Pantalla de TV del local. Se dibuja en un lienzo fijo de 1920×1080 que tv.js escala a cualquier TV.
           Marca: naranja #fb4b08, marrón #5e3d2c, crema #f9f3e9, negro. Sin cursor ni botones. */
        :root {
            --naranja: #fb4b08;
            --marron: #5e3d2c;
            --crema: #f9f3e9;
            --rotacion: 8s;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; user-select: none; -webkit-user-select: none; }
        body { font-family: 'Montserrat', Arial, sans-serif; }

        #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--crema); overflow: hidden; }

        /* ── Mitad izquierda: foto de esquina a esquina, con zoom lento ── */
        .foto-wrap { position: absolute; left: 0; top: 0; width: 960px; height: 960px; background: #000; overflow: hidden; }
        .foto { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease; overflow: hidden; }
        .foto.on { opacity: 1; }
        .foto img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1); transform-origin: 50% 50%; }
        .foto.zoom img { animation: zoom 9s ease-out forwards; }
        @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.14); } }

        /* ── Mitad derecha ── */
        .info { position: absolute; left: 960px; top: 0; width: 960px; height: 960px; background: var(--crema); overflow: hidden; }
        .linea { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--naranja); z-index: 3; }
        .marca-agua { position: absolute; right: -40px; bottom: -150px; font-family: 'Anton', Impact, sans-serif; font-size: 620px; line-height: 1; color: rgba(94, 61, 44, 0.07); letter-spacing: 6px; z-index: 0; pointer-events: none; }
        .panel { position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 70px 70px 70px 100px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 34px; z-index: 2; transition: opacity .28s ease; }
        .panel.saliendo { opacity: 0; }

        .etq { display: inline-block; background: var(--naranja); color: #fff; font-weight: 800; font-size: 32px; letter-spacing: 3px; text-transform: uppercase; padding: 14px 32px; border-radius: 999px; box-shadow: 0 8px 22px rgba(251, 75, 8, .28); animation: etqIn .7s cubic-bezier(.2, .9, .25, 1) both; }
        @keyframes etqIn { from { opacity: 0; transform: translateX(-120px); } to { opacity: 1; transform: translateX(0); } }

        .nombre { font-family: 'Anton', Impact, sans-serif; font-weight: 400; color: var(--marron); text-transform: uppercase; line-height: 1.02; letter-spacing: 1px; }
        .nombre .w { display: inline-block; animation: palIn .65s cubic-bezier(.2, .9, .25, 1) both; animation-delay: calc(.25s + var(--i) * .13s); }
        @keyframes palIn { from { opacity: 0; transform: translateY(46px); } to { opacity: 1; transform: translateY(0); } }

        .ings { list-style: none; display: flex; flex-wrap: wrap; gap: 12px 12px; max-width: 800px; }
        .ings li { font-weight: 700; font-size: 26px; color: var(--marron); background: rgba(94, 61, 44, .08); border: 2px solid rgba(94, 61, 44, .28); border-radius: 999px; padding: 8px 22px; animation: ingIn .5s cubic-bezier(.2, .9, .25, 1) both; animation-delay: var(--d); }
        @keyframes ingIn { from { opacity: 0; transform: translateY(22px) scale(.85); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .precio { font-family: 'Anton', Impact, sans-serif; font-size: 190px; line-height: 1; color: var(--naranja); letter-spacing: 2px; transform-origin: left center;
            animation: precioIn .95s cubic-bezier(.2, .9, .25, 1) var(--d) both, latido 2.6s ease-in-out calc(var(--d) + 1.2s) infinite; }
        .precio small { font-size: .55em; vertical-align: .38em; margin-right: 6px; }
        .precio.dos { font-size: 230px; }
        @keyframes precioIn { 0% { opacity: 0; transform: scale(.2); } 55% { opacity: 1; transform: scale(1.2); } 75% { transform: scale(.93); } 90% { transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }

        /* ── Barra de progreso hacia el siguiente producto ── */
        #barra { position: absolute; left: 0; right: 0; top: 952px; height: 8px; background: rgba(0, 0, 0, .22); z-index: 5; }
        body.en-pausa #barra { opacity: 0; }
        #barra i { display: block; height: 100%; width: 0; background: var(--naranja); }
        @keyframes prog { from { width: 0; } to { width: 100%; } }

        /* ── Franja inferior naranja ── */
        footer { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: var(--naranja); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; z-index: 6; }
        .f-marca { font-family: 'Anton', Impact, sans-serif; font-size: 60px; letter-spacing: 3px; text-transform: uppercase; }
        .f-web { font-weight: 700; font-size: 38px; letter-spacing: .5px; }
        .f-web b { font-weight: 800; }
        .f-qr { display: flex; align-items: center; gap: 22px; }
        .f-qr span { font-weight: 800; font-size: 34px; text-transform: uppercase; letter-spacing: 1px; }
        .qr { width: 104px; height: 104px; background: #fff; border-radius: 10px; padding: 4px; }
        .qr svg { width: 100%; height: 100%; display: block; }

        /* ── Pantalla completa: el botón y la ayuda solo aparecen al mover el mouse / tocar y se ocultan solos ── */
        body.activo, body.activo * { cursor: default; }
        #btnFs { position: fixed; top: 18px; right: 18px; width: 58px; height: 58px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .75); background: rgba(0, 0, 0, .6); color: #fff; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 50; padding: 0; }
        body.activo #btnFs { opacity: 1; pointer-events: auto; cursor: pointer; }
        #btnFs svg { width: 30px; height: 30px; }
        #btnFs .ico-salir { display: none; }
        body.es-fs #btnFs .ico-entrar { display: none; }
        body.es-fs #btnFs .ico-salir { display: block; }
        #hint { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); background: rgba(0, 0, 0, .78); color: #fff; font-weight: 700; font-size: 20px; padding: 14px 26px; border-radius: 999px; z-index: 50; display: none; max-width: 86vw; text-align: center; }
        body.con-ayuda #hint { display: block; }
    </style>
</head>
