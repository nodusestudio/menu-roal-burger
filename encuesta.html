<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ROAL BURGER">
    <meta property="og:title" content="¿Qué tal tu Burger Trifásica? 🍔">
    <meta property="og:description" content="Es un producto nuevo y tu opinión nos ayuda a mejorarlo. Solo 30 segundos.">
    <meta property="og:image" content="https://roalburger.com/og-trifasica.jpg">

    <link rel="apple-touch-icon" href="isotipo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --carbon: #141414;
            --carbon-2: #1E1E1E;
            --naranja: #FF6B00;
            --crema: #F5EBDD;
            --texto: #EDE6DC;
            --texto-suave: rgba(237, 230, 220, 0.74);
            --error: #ff9b8a;
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; background: var(--carbon); }
        body {
            margin: 0; min-height: 100vh; min-height: 100svh;
            font-family: 'Roboto', system-ui, -apple-system, sans-serif; color: var(--texto);
            background: radial-gradient(120% 60% at 50% -10%, rgba(255, 107, 0, 0.22), transparent 60%), var(--carbon);
        }
        :focus-visible { outline: 3px solid var(--naranja); outline-offset: 3px; border-radius: 8px; }
        h1, h2 { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; margin: 0; }

        .en-wrap { max-width: 480px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
        .en-marca { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--crema); text-decoration: none; }
        .en-marca img { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45); }
        .en-marca span { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.08em; }

        .en-card {
            margin-top: 18px; padding: 22px 18px; border-radius: 22px; flex: 1 1 auto; display: flex; flex-direction: column;
            background: rgba(255, 255, 255, 0.08); border: 1.5px solid rgba(255, 255, 255, 0.18);
            -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        }
        .en-progreso { display: flex; gap: 6px; margin-bottom: 18px; }
        .en-progreso i { flex: 1; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.16); transition: background-color 0.25s; }
        .en-progreso i.on { background: var(--naranja); }
        .en-kicker { margin: 0 0 6px; font-family: 'Oswald', sans-serif; letter-spacing: 0.14em; font-size: 0.8rem; color: var(--naranja); text-transform: uppercase; }
        .en-h { font-size: clamp(1.6rem, 7.5vw, 2.1rem); line-height: 1.05; color: var(--crema); }
        .en-sub { margin: 10px 0 0; color: var(--texto-suave); line-height: 1.45; }
        .en-paso { animation: en-in 0.28s ease both; }
        @keyframes en-in { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

        .en-opciones { display: grid; gap: 10px; margin-top: 20px; }
        .en-op {
            font: inherit; font-weight: 700; font-size: 1.08rem; min-height: 58px; padding: 14px 16px; border-radius: 16px; text-align: left; cursor: pointer;
            border: 1.5px solid rgba(255, 255, 255, 0.24); background: rgba(255, 255, 255, 0.06); color: var(--crema);
            display: flex; align-items: center; gap: 12px; -webkit-tap-highlight-color: transparent; transition: transform 0.1s, background-color 0.15s;
        }
        .en-op:active { transform: scale(0.98); }
        .en-op.sel { background: var(--naranja); border-color: var(--naranja); color: var(--carbon); }
        .en-op .em { font-size: 1.5rem; flex: 0 0 auto; }

        .en-texto {
            width: 100%; margin-top: 20px; min-height: 120px; padding: 14px; border-radius: 16px; resize: vertical;
            font: inherit; font-size: 1rem; color: var(--crema); background: rgba(0, 0, 0, 0.35); border: 1.5px solid rgba(255, 255, 255, 0.24);
        }
        .en-texto::placeholder { color: rgba(237, 230, 220, 0.5); }
        .en-btn {
            display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; margin-top: 16px; padding: 14px 18px; border: 0; border-radius: 16px; cursor: pointer;
            font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1.15rem; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none;
            background: var(--naranja); color: var(--carbon); box-shadow: 0 10px 28px rgba(255, 107, 0, 0.35); -webkit-tap-highlight-color: transparent;
        }
        .en-btn:disabled { opacity: 0.6; cursor: progress; }
        .en-atras { margin-top: 12px; background: none; border: 0; color: var(--texto-suave); font: inherit; cursor: pointer; padding: 10px; text-align: center; width: 100%; }
        .en-error { margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; background: rgba(255, 120, 100, 0.14); color: var(--error); font-weight: 500; }

        .en-centro { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; text-align: center; align-items: center; }
        .en-emoji { font-size: 3.6rem; margin-bottom: 8px; }
        .en-puntos { margin: 18px 0 4px; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 3.4rem; line-height: 1; color: var(--naranja); }
        .en-celebra { position: relative; }
        .en-celebra .pop { animation: en-pop 0.7s cubic-bezier(.2, .9, .3, 1.4) both; }
        @keyframes en-pop { from { opacity: 0; transform: scale(0.4) rotate(-10deg); } to { opacity: 1; transform: none; } }
        .en-confeti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
        .en-confeti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px; animation: en-cae linear forwards; }
        @keyframes en-cae { to { transform: translateY(110vh) rotate(720deg); } }
        .en-spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.18); border-top-color: var(--naranja); animation: en-giro 0.8s linear infinite; }
        @keyframes en-giro { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="en-wrap">
        <a class="en-marca" href="https://roalburger.com/" aria-label="ROAL BURGER"><img src="isotipo.webp" alt="" width="44" height="44"><span>ROAL BURGER</span></a>
        <main class="en-card" id="encuestaApp" aria-live="polite" aria-busy="true">
            <div class="en-centro"><div class="en-spin" role="status" aria-label="Cargando"></div></div>
        </main>
    </div>
    <noscript><p style="text-align:center;padding:40px 16px">Activa JavaScript para responder la encuesta.</p></noscript>
    <script src="firebase-config.js?v=20261030-1526"></script>
    <script src="encuesta.js?v=20261030-1526"></script>
</body>
</html>
