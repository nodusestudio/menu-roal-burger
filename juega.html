<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Juega · Block ROAL</title>
    <meta name="description" content="Juega Block ROAL, acumula puntos y canjéalos por créditos en tu próximo pedido de ROAL BURGER.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1a0640">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" type="image/png" href="isotipo.png">
    <link rel="apple-touch-icon" href="isotipo.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js" crossorigin>
    <link rel="preconnect" href="https://us-central1-roal-burger-menu.cloudfunctions.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        :root { --naranja: #ff9100; --beige: #e9ddff; --choc: #12062e; --choc2: #24104f; --choc3: #3b1d80; --ok: #22ff8f; --rosa: #ff2e7e; --cian: #1fd8ff; --amar: #ffe600; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 20% 10%, #5b1fb8 0%, transparent 55%), radial-gradient(ellipse at 85% 30%, #0d4fc4 0%, transparent 50%), radial-gradient(ellipse at 50% 100%, #b3166b 0%, transparent 55%), #12062e; background-size: 140% 140%; animation: cosmos 14s ease-in-out infinite alternate; color: var(--beige); font-family: 'Montserrat', system-ui, sans-serif; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
        @keyframes cosmos { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
        @keyframes giro { to { --ang: 360deg; } }
        @keyframes brillo { to { background-position: 200% center; } }
        h1, h2, .anton { font-family: 'Anton', 'Oswald', sans-serif; font-weight: 400; letter-spacing: .03em; text-transform: uppercase; }
        #app { display: flex; flex-direction: column; height: 100%; max-width: 520px; margin: 0 auto; padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom); }
        header { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
        header a.volver { color: var(--beige); text-decoration: none; font-weight: 700; font-size: .85rem; border: 1px solid #6a3ad8; border-radius: 9px; padding: 8px 11px; background: rgba(36, 16, 79, .85); box-shadow: 0 0 10px rgba(138, 92, 255, .5); }
        header h1 { flex: 1; margin: 0; font-size: 1.7rem; text-align: center; background: linear-gradient(90deg, #ff2e7e, #ff9100, #ffe600, #22ff8f, #1fd8ff, #8a5cff, #ff2e7e); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: brillo 4s linear infinite; filter: drop-shadow(0 0 8px rgba(255, 46, 126, .55)); }
        .snd { display: flex; gap: 6px; }
        .snd button { width: 38px; height: 34px; border-radius: 9px; border: 1px solid #6a3ad8; background: rgba(36, 16, 79, .85); font-size: 1rem; cursor: pointer; color: #fff; box-shadow: 0 0 10px rgba(138, 92, 255, .5); }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .stat { background: rgba(36, 16, 79, .8); border: 1.5px solid transparent; border-radius: 9px; padding: 6px 4px; text-align: center; background-image: linear-gradient(rgba(26, 10, 62, .92), rgba(26, 10, 62, .92)), conic-gradient(from var(--ang), #ff2e7e, #ff9100, #ffe600, #22ff8f, #1fd8ff, #8a5cff, #ff2e7e); background-origin: border-box; background-clip: padding-box, border-box; animation: giro 5s linear infinite; }
        .stat b { display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 1.25rem; color: #fff; text-shadow: 0 0 10px #ff2e7e, 0 0 18px #8a5cff; line-height: 1.1; }
        .stat span { font-size: .62rem; text-transform: uppercase; letter-spacing: .04em; opacity: .8; }
        .sub { font-size: .68rem; opacity: .75; text-align: center; margin: 5px 0 0; }
        #juegoCanvas { flex: 1; min-height: 0; margin-top: 6px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 18px rgba(138, 92, 255, .55)); }
        #juegoCanvas canvas { touch-action: none; }
        .aviso { margin: 6px 0; padding: 8px 10px; border-radius: 9px; background: var(--choc3); font-size: .8rem; text-align: center; box-shadow: 0 0 12px rgba(138, 92, 255, .5); }
        .aviso.err { background: #5a2018; color: #ffd0c4; }
        .overlay { position: fixed; inset: 0; background: rgba(12, 4, 36, .86); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 10; }
        .overlay[hidden], [hidden] { display: none !important; }
        #sinSesion, #resultado { z-index: 60; }
        /* Intro de entrada: túnel de estrellas + título que aparece con zoom */
        #intro { position: fixed; inset: 0; z-index: 50; background: #12062e; display: flex; align-items: center; justify-content: center; text-align: center; transition: opacity .8s ease, transform .8s ease; }
        #intro.salir { opacity: 0; transform: scale(1.8); pointer-events: none; }
        #warp { position: absolute; inset: 0; width: 100%; height: 100%; }
        .intro-in { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px; }
        .intro-ola { font-weight: 800; letter-spacing: .35em; font-size: .78rem; color: #c9b8ff; opacity: 0; animation: aparece 1s .2s forwards; text-shadow: 0 0 10px #8a5cff; }
        .intro-titulo { font-family: 'Anton', sans-serif; font-size: clamp(3rem, 17vw, 5.4rem); line-height: 1; letter-spacing: .04em; background: linear-gradient(90deg, #ff2e7e, #ff9100, #ffe600, #22ff8f, #1fd8ff, #8a5cff, #ff2e7e); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: zoomTitulo 1.4s .4s cubic-bezier(.2, 1.3, .3, 1) both, brillo 3s linear infinite; filter: drop-shadow(0 0 18px rgba(255, 46, 126, .8)) drop-shadow(0 0 40px rgba(31, 216, 255, .5)); }
        .intro-sub { font-family: 'Anton', sans-serif; font-size: 1.6rem; letter-spacing: .12em; text-transform: uppercase; color: #fff; text-shadow: 0 0 14px #22ff8f, 0 0 30px #1fd8ff; opacity: 0; animation: aparece 1s 1.1s forwards; margin-bottom: 18px; }
        .btn.grande { font-size: 1.1rem; padding: 16px 28px; letter-spacing: .06em; opacity: 0; animation: aparece .8s 1.6s forwards, latido 1.3s 2.4s ease-in-out infinite; }
        .intro-estado { font-size: .8rem; color: #c9b8ff; min-height: 1.2em; opacity: 0; animation: aparece .8s 1.8s forwards; }
        .intro-barra { width: min(70vw, 260px); height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-top: 6px; }
        .intro-barra span { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #ff2e7e, #ffe600, #1fd8ff); animation: barra 1.4s ease-in-out infinite; }
        @keyframes aparece { to { opacity: 1; } }
        @keyframes zoomTitulo { from { opacity: 0; transform: scale(3.2); filter: blur(14px); } to { opacity: 1; transform: scale(1); } }
        @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
        @keyframes barra { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
        @keyframes entrar { from { opacity: 0; transform: scale(.55); filter: blur(8px); } to { opacity: 1; transform: scale(1); filter: none; } }
        #app.entrar { animation: entrar .9s cubic-bezier(.2, .9, .3, 1.15); }
        .card { border: 3px solid transparent; border-radius: 16px; padding: 20px 18px; width: min(100%, 360px); text-align: center; background-image: linear-gradient(#1a0a42, #1a0a42), conic-gradient(from var(--ang), #ff2e7e, #ff9100, #ffe600, #22ff8f, #1fd8ff, #8a5cff, #ff2e7e); background-origin: border-box; background-clip: padding-box, border-box; animation: giro 4s linear infinite; box-shadow: 0 0 30px rgba(255, 46, 126, .45), 0 0 60px rgba(31, 216, 255, .25); }
        .card h2 { margin: 0 0 6px; font-size: 1.8rem; color: #ffe600; text-shadow: 0 0 14px #ff9100; }
        .card .pts { font-family: 'Anton', sans-serif; font-size: 2.6rem; color: #fff; text-shadow: 0 0 14px #22ff8f, 0 0 28px #1fd8ff; margin: 4px 0; }
        .card p { white-space: pre-line; font-size: .9rem; line-height: 1.5; margin: 8px 0 14px; }
        .btn { display: inline-block; border: none; border-radius: 10px; padding: 12px 20px; font: 800 .95rem 'Montserrat', sans-serif; background: linear-gradient(135deg, #ff2e7e, #ff9100); color: #fff; cursor: pointer; text-decoration: none; box-shadow: 0 0 16px rgba(255, 46, 126, .7); text-shadow: 0 1px 2px rgba(0, 0, 0, .35); }
        .btn:disabled { opacity: .5; }
        .btn.sec { background: rgba(59, 29, 128, .9); color: var(--beige); margin-left: 6px; box-shadow: 0 0 12px rgba(138, 92, 255, .6); }
    </style>
</head>
<body>
    <div id="intro">
        <canvas id="warp"></canvas>
        <div class="intro-in">
            <div class="intro-ola">ESTÁS LLEGANDO A</div>
            <div class="intro-titulo">BLOCK ROAL</div>
            <div class="intro-sub">otro universo</div>
            <button type="button" class="btn grande" id="btnEntrar">TOCA PARA ENTRAR</button>
            <div class="intro-estado" id="introEstado">Sube el volumen 🔊</div>
            <div class="intro-barra"><span></span></div>
        </div>
    </div>

    <div id="app" hidden>
        <header>
            <a class="volver" href="/">← Menú</a>
            <h1>Block ROAL</h1>
            <div class="snd"><button type="button" id="btnMusica" aria-label="Música" aria-pressed="true">🎵</button><button type="button" id="btnSfx" aria-label="Efectos de sonido" aria-pressed="true">🔊</button></div>
        </header>
        <div class="stats" aria-live="polite">
            <div class="stat"><b id="stNivel">1</b><span>Nivel</span></div>
            <div class="stat"><b id="stMeta">500</b><span>Meta pts</span></div>
            <div class="stat"><b id="stRacha">0</b><span>Racha 🔥</span></div>
            <div class="stat"><b id="stCredito">$0</b><span>Créditos</span></div>
        </div>
        <p class="sub">Puntos de hoy: <b id="stHoy">0 / 300</b> · Racha: <span id="stBonus"></span></p>
        <div class="aviso" id="avisoJuego" hidden></div>
        <div id="juegoCanvas"></div>
    </div>

    <div class="overlay" id="sinSesion" hidden>
        <div class="card">
            <h2>Inicia sesión</h2>
            <p>Para jugar y guardar tus puntos entra a tu cuenta ROAL desde el menú.</p>
            <a class="btn" href="/">Ir al menú</a>
        </div>
    </div>

    <div class="overlay" id="resultado" hidden>
        <div class="card">
            <h2 id="resTitulo">Fin de la partida</h2>
            <div class="pts" id="resPuntaje">0 pts</div>
            <p id="resDetalle"></p>
            <button class="btn" id="btnOtra" type="button">Jugar otra</button><a class="btn sec" href="/">Ir al menú</a>
        </div>
    </div>

    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
    <script defer src="firebase-config.js"></script>
    <script defer src="juega.js?v=20261122d"></script>
</body>
</html>
