<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Juega · Block ROAL</title>
    <meta name="description" content="Juega Block ROAL, acumula puntos y canjéalos por créditos en tu próximo pedido de ROAL BURGER.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#2a1810">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" type="image/png" href="isotipo.png">
    <link rel="apple-touch-icon" href="isotipo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --naranja: #ff6b00; --beige: #e8d3a8; --choc: #2a1810; --choc2: #3a2418; --choc3: #4a2e1e; --ok: #7dffa1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; height: 100%; background: var(--choc); color: var(--beige); font-family: 'Montserrat', system-ui, sans-serif; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
        h1, h2, .anton { font-family: 'Anton', 'Oswald', sans-serif; font-weight: 400; letter-spacing: .03em; text-transform: uppercase; }
        #app { display: flex; flex-direction: column; height: 100%; max-width: 520px; margin: 0 auto; padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom); }
        header { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
        header a.volver { color: var(--beige); text-decoration: none; font-weight: 700; font-size: .85rem; border: 1px solid var(--choc3); border-radius: 9px; padding: 7px 11px; background: var(--choc2); }
        header h1 { flex: 1; margin: 0; font-size: 1.5rem; color: var(--naranja); text-align: center; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .stat { background: var(--choc2); border: 1px solid var(--choc3); border-radius: 9px; padding: 6px 4px; text-align: center; }
        .stat b { display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 1.2rem; color: var(--naranja); line-height: 1.1; }
        .stat span { font-size: .62rem; text-transform: uppercase; letter-spacing: .04em; opacity: .8; }
        .sub { font-size: .68rem; opacity: .75; text-align: center; margin: 5px 0 0; }
        #juegoCanvas { flex: 1; min-height: 0; margin-top: 6px; display: flex; align-items: center; justify-content: center; }
        #juegoCanvas canvas { touch-action: none; }
        .aviso { margin: 6px 0; padding: 8px 10px; border-radius: 9px; background: var(--choc3); font-size: .8rem; text-align: center; }
        .aviso.err { background: #5a2018; color: #ffd0c4; }
        .overlay { position: fixed; inset: 0; background: rgba(20, 10, 5, .88); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 10; }
        .overlay[hidden], [hidden] { display: none !important; }
        .card { background: var(--choc2); border: 1px solid var(--naranja); border-radius: 14px; padding: 20px 18px; width: min(100%, 360px); text-align: center; }
        .card h2 { margin: 0 0 6px; font-size: 1.7rem; color: var(--naranja); }
        .card .pts { font-family: 'Anton', sans-serif; font-size: 2.4rem; color: #ffd84a; margin: 4px 0; }
        .card p { white-space: pre-line; font-size: .9rem; line-height: 1.5; margin: 8px 0 14px; }
        .btn { display: inline-block; border: none; border-radius: 9px; padding: 12px 20px; font: 700 .95rem 'Montserrat', sans-serif; background: var(--naranja); color: #1a0c04; cursor: pointer; text-decoration: none; }
        .btn:disabled { opacity: .5; }
        .btn.sec { background: var(--choc3); color: var(--beige); margin-left: 6px; }
    </style>
</head>
<body>
    <div id="app" hidden>
        <header>
            <a class="volver" href="/">← Menú</a>
            <h1>Block ROAL</h1>
        </header>
        <div class="stats" aria-live="polite">
            <div class="stat"><b id="stNivel">1</b><span>Nivel</span></div>
            <div class="stat"><b id="stMeta">500</b><span>Meta pts</span></div>
            <div class="stat"><b id="stRacha">0</b><span>Racha 🔥</span></div>
            <div class="stat"><b id="stCredito">$0</b><span>Créditos</span></div>
        </div>
        <p class="sub">Puntos de hoy: <b id="stHoy">0 / 300</b> · Racha: <span id="stBonus"></span></p>
        <div class="aviso" id="avisoJuego" hidden></div>
        <div id="juegoCanvas"></div>
    </div>

    <div class="overlay" id="sinSesion" hidden>
        <div class="card">
            <h2>Inicia sesión</h2>
            <p>Para jugar y guardar tus puntos entra a tu cuenta ROAL desde el menú.</p>
            <a class="btn" href="/">Ir al menú</a>
        </div>
    </div>

    <div class="overlay" id="resultado" hidden>
        <div class="card">
            <h2 id="resTitulo">Fin de la partida</h2>
            <div class="pts" id="resPuntaje">0 pts</div>
            <p id="resDetalle"></p>
            <button class="btn" id="btnOtra" type="button">Jugar otra</button><a class="btn sec" href="/">Ir al menú</a>
        </div>
    </div>

    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
    <script defer src="firebase-config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script defer src="juega.js?v=20261122"></script>
</body>
</html>
